spring:
  application:
    name: devmate-ai
  profiles:
    default: local
  datasource:
    url: jdbc:h2:mem:devmate;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
    com.devmate: info

devmate:
  source:
    workspace-root: ${user.dir}/workspace
    clone-timeout-seconds: 60
    clone-depth: 50
    max-java-files: 1000
    max-config-files: 100
    max-schema-files: 100
    max-file-size-bytes: 1048576
    max-total-size-bytes: 52428800
    git-username: ${DEVMATE_GIT_USERNAME:x-access-token}
    git-token: ${DEVMATE_GIT_TOKEN:}
  retrieval:
    config-version: lexical-graph-v1
    candidate-limit: 1000
    reference-limit: 5000
    default-top-k: 8
    default-token-budget: 4000
    preview-characters: 800
    max-trimmed-details: 50
    max-evaluation-cases: 100
  embedding:
    provider: ${DEVMATE_EMBEDDING_PROVIDER:LOCAL}
    model: ${DEVMATE_EMBEDDING_MODEL:text-embedding-v4}
    base-url: ${DEVMATE_EMBEDDING_BASE_URL:}
    api-key: ${DASHSCOPE_API_KEY:}
    dimensions: ${DEVMATE_EMBEDDING_DIMENSIONS:1024}
    local-dimensions: 256
    batch-size: 10
    max-input-characters: 16000
    max-index-chunks: 5000
    max-vector-scan: 5000
    minimum-similarity: 0.05
  analysis:
    timeout-seconds: 30
    max-files: 200
