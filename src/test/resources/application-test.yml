spring:
  datasource:
    # Spring may cache several differently configured test contexts in one JVM.
    # Give each context its own database so non-transactional fixtures cannot leak.
    url: jdbc:h2:mem:devmate-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE

devmate:
  security:
    enabled: false
  model-connections:
    encryption-secret: test-model-encryption-secret-32-characters
